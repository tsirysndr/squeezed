name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: darwin-amd64
            os: macos-latest
            target: x86_64-apple-darwin
          - label: darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - label: linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Native ARM Linux runner — no `cross`, no QEMU. Faster and
          # matches production glibc more closely.
          - label: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      - name: Checkout pipeline
        if: runner.os == 'Linux'
        uses: actions/checkout@v4

      - name: Checkout release source
        if: runner.os == 'Linux'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: .source

      - name: Install Dagger
        if: runner.os == 'Linux'
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77
        with:
          version: v1.0.0-beta.21

      - name: Run PureScript Dagger pipeline
        if: runner.os == 'Linux'
        uses: ./.github/actions/dagger
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ inputs.tag || github.ref_name }}
        with:
          module: ci
          key: release-${{ matrix.target }}
          volumes: squeezed-cargo-registry,squeezed-cargo-git,squeezed-target-${{ matrix.target }}
          command: |
            dagger api call -m ci linux-release --source ../.source --target "$TARGET" --version "$VERSION" --output ../dist

      - name: Checkout
        if: runner.os == 'macOS'
        uses: actions/checkout@v4
        with:
          # On manual dispatch, build the tag's code rather than the branch
          # the workflow was dispatched from.
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust toolchain
        if: runner.os == 'macOS'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        if: runner.os == 'macOS'
        uses: Swatinem/rust-cache@v2
        with:
          # Key on the unique per-job label, not the OS: darwin-amd64 and
          # darwin-arm64 both run on the same macos-latest (ARM) runner, so a
          # shared key would let one clobber/restore the other's cache.
          key: ${{ matrix.label }}

      - name: Build
        if: runner.os == 'macOS'
        run: cargo build --release --locked --target ${{ matrix.target }} --bin squeezed

      # The HAL driver is embedded in the squeezed binary (via build.rs), but
      # we also ship the assembled .driver bundle as a standalone asset for
      # people who want to install it manually.

      - name: Build HAL driver crate (macOS)
        if: runner.os == 'macOS'
        run: cargo build --release --locked --target ${{ matrix.target }} -p squeezed-driver

      - name: Package HAL driver bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.tag }}"
          else
            version="${GITHUB_REF_NAME}"
          fi
          bundle="dist/SqueezedAudio.driver"
          mkdir -p "$bundle/Contents/MacOS"
          cp driver/Info.plist "$bundle/Contents/Info.plist"
          cp "target/${{ matrix.target }}/release/libsqueezed_driver.dylib" \
             "$bundle/Contents/MacOS/SqueezedAudio"
          codesign --force --sign - "$bundle"
          name="squeezed-driver-${version}-${{ matrix.label }}"
          ditto -c -k --keepParent "$bundle" "dist/${name}.zip"
          rm -rf "$bundle"
          (cd dist && shasum -a 256 "${name}.zip" > "${name}.zip.sha256")
          ls -lh dist

      - name: Package tarball
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.tag }}"
          else
            version="${GITHUB_REF_NAME}"
          fi
          name="squeezed-${version}-${{ matrix.label }}"
          src="target/${{ matrix.target }}/release/squeezed"
          mkdir -p dist/staging
          cp "$src" dist/staging/squeezed
          cp README.md LICENSE squeezed.example.toml dist/staging/
          tar -C dist/staging -czf "dist/${name}.tar.gz" .
          (cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            dist/*.tar.gz*
            dist/*.deb*
            dist/*.rpm*
            dist/*.zip*
          if-no-files-found: error

  # FreeBSD builds quickly and reliably (`pkg install` from a fast CDN), so it
  # stays on the release's critical path.

  build-freebsd:
    name: freebsd-amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # On manual dispatch, build the tag's code rather than the branch
          # the workflow was dispatched from.
          ref: ${{ inputs.tag || github.ref }}

      - name: Start freebsd x86-64 VM
        uses: cross-platform-actions/action@v1.3.0
        with:
          operating_system: freebsd
          version: "14.3"
          architecture: x86-64
          shell: bash
          memory: 8G
          cpu_count: 4

      - name: Build in VM
        shell: cpa.sh {0}
        run: |
          set -euo pipefail
          sudo env ASSUME_ALWAYS_YES=YES pkg install -y rust
          # Keep target/ outside the workspace so it isn't synced back
          export CARGO_TARGET_DIR="$HOME/build"
          cargo build --release --locked --bin squeezed
          mkdir -p dist
          cp "$CARGO_TARGET_DIR/release/squeezed" dist/squeezed

      - name: Package tarball
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.tag }}"
          else
            version="${GITHUB_REF_NAME}"
          fi
          name="squeezed-${version}-freebsd-amd64"
          mkdir -p dist/staging
          install -m 0755 dist/squeezed dist/staging/squeezed
          cp README.md LICENSE squeezed.example.toml dist/staging/
          tar -C dist/staging -czf "dist/${name}.tar.gz" .
          (cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: freebsd-amd64
          path: dist/*.tar.gz*
          if-no-files-found: error

  # NetBSD is slow to provision (large Rust/LLVM toolchain over pkgsrc), so it
  # is fully decoupled: it never gates the release (see the `release` job's
  # `needs`), it is time-boxed so it can't hang the run, and its asset is
  # attached to the already-published release by `release-netbsd`.
  build-netbsd:
    name: netbsd-amd64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # A NetBSD failure/timeout must not turn the whole release run red — the
    # release is already published independently.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Start netbsd x86-64 VM
        uses: cross-platform-actions/action@v1.3.0
        with:
          operating_system: netbsd
          version: "10.1"
          architecture: x86-64
          shell: bash
          memory: 8G
          cpu_count: 4

      - name: Build in VM
        shell: cpa.sh {0}
        run: |
          set -euo pipefail
          # Point pkgin at the fast HTTPS CDN instead of the default (painfully
          # slow) ftp.NetBSD.org mirror, then let pkgin install Rust. Unlike
          # bare `pkg_add`, pkgin resolves the full dependency graph and upgrades
          # already-installed deps (e.g. the base curl 8.19.0 -> the newer curl
          # the current Rust package requires), which is what failed before.
          sudo sh -c 'echo "https://cdn.NetBSD.org/pub/pkgsrc/packages/NetBSD/amd64/10.1/All" > /usr/pkg/etc/pkgin/repositories.conf'
          sudo pkgin -y update
          sudo pkgin -y install rust
          # Keep target/ outside the workspace so it isn't synced back
          export CARGO_TARGET_DIR="$HOME/build"
          cargo build --release --locked --bin squeezed
          mkdir -p dist
          cp "$CARGO_TARGET_DIR/release/squeezed" dist/squeezed

      - name: Package tarball
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.tag }}"
          else
            version="${GITHUB_REF_NAME}"
          fi
          name="squeezed-${version}-netbsd-amd64"
          mkdir -p dist/staging
          install -m 0755 dist/squeezed dist/staging/squeezed
          cp README.md LICENSE squeezed.example.toml dist/staging/
          tar -C dist/staging -czf "dist/${name}.tar.gz" .
          (cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: netbsd-amd64
          path: dist/*.tar.gz*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    # Deliberately does NOT depend on build-netbsd — the slow NetBSD build must
    # never block publishing. Its asset is added afterward by release-netbsd.
    needs: [build, build-freebsd]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pipeline
        uses: actions/checkout@v4

      - name: Install Dagger
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77
        with:
          version: v1.0.0-beta.21

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show artifacts
        run: ls -lh dist

      - name: Publish release with Dagger
        working-directory: .dagger
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          WORKFLOW_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: dagger api call -m ci publish-release --assets ../dist --tag "$RELEASE_TAG" --token env://GH_TOKEN --run-id "$WORKFLOW_RUN"

      - name: Publish packages with Dagger
        working-directory: .dagger
        env:
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
          FURY_ACCOUNT: ${{ secrets.FURY_ACCOUNT }}
          WORKFLOW_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: dagger api call -m ci publish-gemfury --assets ../dist --account env://FURY_ACCOUNT --token env://FURY_TOKEN --run-id "$WORKFLOW_RUN"


  # Attach the NetBSD tarball to the already-published release once it's ready.
  # Depends on `release` (so the release exists) but `release` never waits on
  # NetBSD — if build-netbsd is slow, fails, or times out, this job simply skips
  # and the rest of the release is unaffected.
  release-netbsd:
    name: Attach NetBSD asset
    needs: [build-netbsd, release]
    # Only when NetBSD actually built and the release exists; otherwise skip
    # cleanly (never fail the run over the optional NetBSD asset).
    if: ${{ always() && needs.release.result == 'success' && needs.build-netbsd.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download NetBSD artifact
        uses: actions/download-artifact@v4
        with:
          name: netbsd-amd64
          path: dist

      - name: Show artifacts
        run: ls -lh dist

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*.tar.gz*
          # The release already exists with its notes — just add this asset.
          generate_release_notes: false
          draft: false
          prerelease: false
