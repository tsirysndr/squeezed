name: Nix

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nix-build:
    name: nix build & flake checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dagger
        run: bash .dagger/install-dagger.sh

      - name: Run PureScript Dagger pipeline
        uses: ./.github/actions/dagger
        env:
          CACHIX_AUTH_TOKEN: ""
          WORKFLOW_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        with:
          module: ci
          key: nix-flake
          volumes: squeezed-nix-store
          command: |
            dagger api call -m ci nix-build --source .. --cachix-token env://CACHIX_AUTH_TOKEN --run-id "$WORKFLOW_RUN"
